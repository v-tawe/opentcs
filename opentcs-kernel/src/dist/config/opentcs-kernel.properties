# VDA5050 通信适配器配置
commadapter.vehicle.vda5050.mqtt.brokerHost=localhost
commadapter.vehicle.vda5050.mqtt.brokerPort=1883
commadapter.vehicle.vda5050.mqtt.connectionEncrypted=false
commadapter.vehicle.vda5050.mqtt.username=
commadapter.vehicle.vda5050.mqtt.password=
commadapter.vehicle.vda5050.mqtt.clientId=openTCS
commadapter.vehicle.vda5050.mqtt.keepAliveInterval=60
commadapter.vehicle.vda5050.mqtt.reconnectInterval=5000

# VDA5050 通信适配器核心配置
commadapter.vehicle.vda5050.enabledVersions=2.0
commadapter.vehicle.vda5050.onOpModeChangeDoUpdateIntegrationLevel.TEACHIN=LEAVE_UNCHANGED
commadapter.vehicle.vda5050.onOpModeChangeDoUpdateIntegrationLevel.SERVICE=LEAVE_UNCHANGED
commadapter.vehicle.vda5050.onOpModeChangeDoUpdateIntegrationLevel.MANUAL=LEAVE_UNCHANGED
commadapter.vehicle.vda5050.onOpModeChangeDoUpdateIntegrationLevel.SEMIAUTOMATIC=TO_BE_RESPECTED
commadapter.vehicle.vda5050.onOpModeChangeDoUpdateIntegrationLevel.AUTOMATIC=TO_BE_UTILIZED
commadapter.vehicle.vda5050.onOpModeChangeDoWithdrawOrder.TEACHIN=true
commadapter.vehicle.vda5050.onOpModeChangeDoWithdrawOrder.SERVICE=true
commadapter.vehicle.vda5050.onOpModeChangeDoWithdrawOrder.MANUAL=true
commadapter.vehicle.vda5050.onOpModeChangeDoWithdrawOrder.SEMIAUTOMATIC=false
commadapter.vehicle.vda5050.onOpModeChangeDoWithdrawOrder.AUTOMATIC=false
commadapter.vehicle.vda5050.onOpModeChangeDoResetPosition.TEACHIN=true
commadapter.vehicle.vda5050.onOpModeChangeDoResetPosition.SERVICE=true
commadapter.vehicle.vda5050.onOpModeChangeDoResetPosition.MANUAL=true
commadapter.vehicle.vda5050.onOpModeChangeDoResetPosition.SEMIAUTOMATIC=false
commadapter.vehicle.vda5050.onOpModeChangeDoResetPosition.AUTOMATIC=false
